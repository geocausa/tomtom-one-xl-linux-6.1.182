# TomTom ONE XL Bluetooth playback bridge.
# BlueALSA presents 44.1 kHz PCM; the S3C2412 physical clock is 42968.75 Hz.
# The kernel exposes 42968 as a hardware-facing KNOT rate and ALSA resamples
# 44100 -> 42968 before feeding hw:0,0.
pcm.ttbt {
    type plug
    slave {
        pcm "hw:0,0"
        format S16_LE
        channels 2
        rate 42968
    }
}
ctl.ttbt {
    type hw
    card 0
}
